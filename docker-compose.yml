# Minimal self-hosted deployment: just the app.
# Use this if you already have your own reverse proxy (Caddy, Nginx Proxy Manager,
# Traefik, etc.) and your own backup solution (restic, borg, …).
#
#   docker compose up -d
#
# The app listens on http://localhost:3000. Point your reverse proxy at it.
# For the full stack (app + Caddy with auto-HTTPS + nightly backup sidecar),
# see docker-compose.full.yml.

services:
  app:
    image: ghcr.io/gavark/babysleep:latest
    # Falls back to building from source if the image isn't pulled (e.g. for users
    # who prefer to build from source, or before the first GHCR push exists).
    build:
      context: .
      dockerfile: Dockerfile
    container_name: babysleep
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/babysleep.sqlite
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - TZ=${TZ:-Europe/Paris}
      - ORIGIN=${ORIGIN:-}
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
    volumes:
      - babysleep_data:/data

volumes:
  babysleep_data:
