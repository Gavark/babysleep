name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]

# Cancel an in-progress run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # Same flags as the Dockerfile: use better-sqlite3's prebuilt binary
      # instead of compiling it from source with node-gyp.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run check

      - name: Unit + integration tests
        run: npm test
