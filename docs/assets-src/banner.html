<!doctype html>
<!--
  Source template for static/screenshots/banner.png.

  To re-render after a UI or brand change:
    1. npm run demo                       (seeds data/demo.sqlite, serves :5199)
    2. copy this file, the other template, node_modules/@fontsource-variable/
       nunito/files/nunito-latin-wght-normal.woff2 (as nunito.woff2),
       static/icon-512.png (as icon.png) and static/screenshots/calendar.png
       into static/_assets/
    3. open http://localhost:5199/_assets/banner.html at 1280x420 and screenshot
    4. delete static/_assets/ so it is never served in production

  The :root block below is copied verbatim from src/lib/styles/tokens.css.
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Nunito Variable';
    font-style: normal;
    font-display: block;
    font-weight: 200 1000;
    src: url('/_assets/nunito.woff2') format('woff2-variations');
  }

  /* Tokens lifted verbatim from src/lib/styles/tokens.css so the asset and the
     app can never drift apart. */
  :root {
    --c-bg-app: #FBF8F3;
    --c-bg-card: #FFFFFF;
    --c-bg-muted: #FAF0E6;
    --c-primary: #C97A5D;
    --c-accent-honey: #E8B86E;
    --c-accent-sage: #7A9A87;
    --c-text: #3D2E25;
    --c-text-muted: #7A6655;
    --c-border: #E5D5C0;
    --r-lg: 14px;
    --r-xl: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1280px;
    height: 420px;
    overflow: hidden;
    font-family: 'Nunito Variable', system-ui, sans-serif;
    background: var(--c-bg-app);
    color: var(--c-text);
    display: grid;
    grid-template-columns: 560px 1fr;
    align-items: center;
  }

  .copy { padding: 0 0 0 64px; }

  .lockup { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .lockup img { width: 64px; height: 64px; border-radius: 16px; display: block; }
  .lockup span { font-size: 40px; font-weight: 800; letter-spacing: -0.5px; }

  h1 {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.3px;
    margin-bottom: 14px;
    max-width: 26ch;
  }

  p {
    font-size: 17px;
    line-height: 1.55;
    color: var(--c-text-muted);
    max-width: 34ch;
    margin-bottom: 26px;
  }

  .facts { display: flex; gap: 8px; }
  .fact {
    font-size: 13px;
    font-weight: 700;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1.5px solid var(--c-border);
    background: var(--c-bg-card);
    color: var(--c-text-muted);
  }

  /* Real product screenshot, cropped to three weeks of the month grid and bled
     off the right edge. No mock UI, no invented chrome. */
  .shot { position: relative; height: 420px; }
  .frame {
    position: absolute;
    top: 65px;
    height: 290px;
    left: 0;
    right: -48px;
    overflow: hidden;
    border-radius: var(--r-lg);
    border: 1.5px solid var(--c-border);
    background: var(--c-bg-card);
    box-shadow: 0 4px 16px rgba(61, 46, 37, 0.10);
  }
  .frame img {
    position: absolute;
    top: -400px;
    left: -160px;
    width: 1024px;
    display: block;
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="lockup">
      <img src="/_assets/icon.png" alt="" />
      <span>BabySleep</span>
    </div>
    <h1 data-fr="Le sommeil de votre bébé, sur votre propre serveur."
        data-en="Your baby's sleep, on your own server.">Le sommeil de votre bébé, sur votre propre serveur.</h1>
    <p data-fr="Siestes, nuits et fenêtres d'éveil dans une PWA que vous hébergez vous-même. Un fichier SQLite, rien d'autre."
       data-en="Naps, nights and wake windows in a PWA you host yourself. One SQLite file, nothing else.">Siestes, nuits et fenêtres d'éveil dans une PWA que vous hébergez vous-même. Un fichier SQLite, rien d'autre.</p>
    <div class="facts">
      <span class="fact" data-fr="Auto-hébergé" data-en="Self-hosted">Auto-hébergé</span>
      <span class="fact">Docker</span>
      <span class="fact">AGPL-3.0</span>
      <span class="fact">FR / EN</span>
    </div>
  </div>
  <div class="shot">
    <div class="frame"><img src="/_assets/calendar.png" alt="" /></div>
  </div>
<script>
  // Same board in both locales: ?lang=en swaps every data-en string in place.
  if (new URLSearchParams(location.search).get('lang') === 'en') {
    for (const el of document.querySelectorAll('[data-en]')) el.textContent = el.dataset.en;
  }
</script>
</body>
</html>
